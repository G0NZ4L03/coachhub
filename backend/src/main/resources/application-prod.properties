spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
server.port=${PORT:8080}

# Verificamos que la conexion sigue viva antes de usarla
# Evita errores cuando Railway reinicia el MySQL y el pool de Hikari tiene conexiones cerradas
spring.datasource.hikari.connection-test-query=SELECT 1

# Tiempo maximo de vida de una conexion en el pool (9 minutos en ms)
# Railway cierra conexiones inactivas antes de este tiempo, asi forzamos renovarlas antes
spring.datasource.hikari.max-lifetime=540000